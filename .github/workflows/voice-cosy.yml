name: Chinese words by CosyVoice
on:
  push:
    branches: [main]
    paths: [voice/make_cosy.py, .github/workflows/voice-cosy.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-cosy
  cancel-in-progress: true
jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: CosyVoice
        run: |
          git clone --depth 1 --recursive https://github.com/FunAudioLLM/CosyVoice.git
          sudo apt-get install -y -q sox libsox-dev >/dev/null
          pip install -q "setuptools<70" wheel
          pip install -q torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-build-isolation openai-whisper==20231117
          pip install -q conformer==0.3.2 diffusers==0.29.0 hydra-core==1.3.2 HyperPyYAML==1.2.3 inflect==7.3.1 \
            librosa==0.10.2 lightning==2.2.4 modelscope==1.20.0 networkx==3.1 numpy==1.26.4 omegaconf==2.3.0 \
            onnx==1.16.0 onnxruntime==1.18.0 protobuf==4.25 pyarrow==18.1.0 pydantic==2.7.0 \
            pyworld==0.3.4 soundfile==0.12.1 transformers==4.51.3 x-transformers==2.11.24 wetext==0.0.4 wget==3.2 \
            huggingface_hub matplotlib==3.7.5 rich==13.7.1 gdown==5.1.0 tensorboard==2.14.0
          python -c "from huggingface_hub import snapshot_download; snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512', local_dir='CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B')"
          ls CosyVoice/pretrained_models/Fun-CosyVoice3-0.5B
      - name: Words
        env:
          SET: basic
        run: python voice/make_cosy.py words
      - name: Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -d words || exit 1
          tag="voice-cosy-${{ github.run_number }}"
          (cd words && tar -cf ../words.tar .)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Chinese words by CosyVoice (${{ github.run_number }})" \
            --notes "voice/make_cosy.py: each word said on its own by Fun-CosyVoice3-0.5B." || true
          gh release upload "$tag" words.tar --clobber --repo "$GITHUB_REPOSITORY"
          test -f words/report.json && gh release upload "$tag" words/report.json --clobber --repo "$GITHUB_REPOSITORY" || true
